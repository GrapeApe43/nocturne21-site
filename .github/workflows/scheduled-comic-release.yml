name: scheduled comic release

permissions:
  contents: write
  actions: write

concurrency:
  group: scheduled-comic-release
  cancel-in-progress: false

on:
  # GitHub Actions uses UTC cron.
  # Check four times per hour, slightly offset from the top of the hour.
  schedule:
    - cron: "7,22,37,52 * * * *"

  # This gives us a Run workflow button for testing.
  workflow_dispatch:

jobs:
  check-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check scheduled comic releases
        id: release
        run: python publish-scheduled-comic.py

      - name: Commit released comic data
        if: steps.release.outputs.released == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add js/comic_settings.js scheduled-comic-releases.json
          git commit -m "Publish scheduled comic page(s) ${{ steps.release.outputs.pages }}"
          git push

      - name: Run normal Nocturne 21 publish workflow
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish.yml --ref "${{ github.ref_name }}"

      - name: Deploy updated site to Neocities
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy.yml --ref "${{ github.ref_name }}"

name: publish

permissions:
  contents: write

concurrency:
  group: publish-main
  cancel-in-progress: false

on:
  push:
    paths:
      - "js/comic_settings.js"
      - "generate-rss.py"
      - "n21-journal-data.js"
      - "publish-journal.py"
      - ".github/workflows/publish.yml"

  workflow_dispatch:
    inputs:
      publish_comic:
        description: "Post comic update?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      publish_journal:
        description: "Post journal update?"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests feedgen pytumblr

      - name: Generate RSS only
        run: python generate-rss.py

      - name: Post comic to social media
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_comic == 'true'
        run: python generate-rss.py
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_OAUTH_TOKEN: ${{ secrets.TUMBLR_OAUTH_TOKEN }}
          TUMBLR_OAUTH_SECRET: ${{ secrets.TUMBLR_OAUTH_SECRET }}

      - name: Post journal to social media
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_journal == 'true'
        run: python publish-journal.py
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_OAUTH_TOKEN: ${{ secrets.TUMBLR_OAUTH_TOKEN }}
          TUMBLR_OAUTH_SECRET: ${{ secrets.TUMBLR_OAUTH_SECRET }}

      - name: Save publish trackers to repo
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .last_discord_post.txt .last_journal_post.txt rss.xml journal-rss.xml 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "Update publish trackers"
            git pull --rebase --autostash origin main
            git push origin main
          else
            echo "No tracker or RSS changes to commit."
          fi

      - name: Upload rss.xml to Neocities
        run: |
          curl -u "${{ secrets.NEOCITIES_USERNAME }}:${{ secrets.NEOCITIES_API_KEY }}" \
          -F "rss.xml=@rss.xml" \
          https://neocities.org/api/upload

      - name: Upload journal-rss.xml to Neocities
        if: hashFiles('journal-rss.xml') != ''
        run: |
          curl -u "${{ secrets.NEOCITIES_USERNAME }}:${{ secrets.NEOCITIES_API_KEY }}" \
          -F "journal-rss.xml=@journal-rss.xml" \
          https://neocities.org/api/upload

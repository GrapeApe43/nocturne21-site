    /* LAB TEST: consistent element sizing */
*, *::before, *::after {
  box-sizing: border-box;
}
    .comic-intro {
      width: calc(100% - 40px);
      max-width: 900px;
      box-sizing: border-box;
      margin: 28px auto 14px;
      padding: 20px 24px;
      background: rgba(17, 24, 39, 0.82);
      border: 1px solid rgba(93, 97, 171, 0.85);
      text-align: left;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
      clear: both;
      overflow: visible;
    }

    .comic-intro h2 {
      margin: 0 0 12px;
      text-align: center;
      font-family: 'Lacquer Regular', 'Lacquer', cursive;
      font-size: 1.5em;

    .comic-intro p {

    @media (max-width: 600px) {
      .comic-intro {
        width: calc(100% - 24px);
        padding: 17px 18px;
        margin-top: 22px;
      }

      .comic-intro h2 {
        font-size: 1.35em;
      }
    }

/* Compact, floating chapter navigator */
.n21-jump {position:relative;display:table;margin:8px auto 0;z-index:30;font-family:'Open Sans',sans-serif;text-align:left}
.n21-jump-trigger {width:235px;max-width:calc(100vw - 32px);padding:9px 14px;border:1px solid #7771b4;border-radius:12px;background:linear-gradient(135deg,#242743,#101424);color:#eeeaff;box-shadow:0 3px 14px #0008;cursor:pointer;font:600 12px 'Open Sans',sans-serif;display:flex;justify-content:space-between;align-items:center}
.n21-jump-trigger:hover,.n21-jump-trigger:focus-visible {border-color:#b3a4ed;box-shadow:0 0 12px #7269c366;outline-offset:2px}
.n21-jump-panel {position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);width:290px;max-width:calc(100vw - 24px);max-height:min(420px,65vh);overflow-y:auto;overscroll-behavior:contain;padding:10px;box-sizing:border-box;border:1px solid #7973af;border-radius:14px;background:#101323;box-shadow:0 12px 32px #000c;color:#eeeaff;z-index:100}
.n21-jump-panel[hidden] {display:none}
.n21-jump-volume + .n21-jump-volume {border-top:1px solid #4c486d;margin-top:12px;padding-top:12px}
.n21-jump-volume-title {color:#b4a9ed;font-size:11px;letter-spacing:.06em;font-weight:700;text-transform:uppercase}
.n21-jump-volume-link {display:inline-block;margin:5px 0 7px;color:#ddd8fa;font-size:11px;text-decoration:none}
.n21-jump-chapter {margin:5px 0;border:1px solid #343754;border-radius:8px;background:#1a1d33}
.n21-jump-chapter summary {cursor:pointer;padding:9px 10px;font-size:12px;color:#eeeaff;list-style-position:inside}
.n21-jump-chapter[open] summary {border-bottom:1px solid #343754;color:#c4baff}
.n21-jump-pages {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:8px}
.n21-jump-pages a {min-width:0;overflow-wrap:anywhere;padding:7px 3px;border-radius:5px;background:#252943;text-align:center;color:#e7e5fa;text-decoration:none;font-size:10px;line-height:1.4}
.n21-jump-pages a:hover,.n21-jump-pages a:focus-visible {background:#484276;color:white}
@media(max-width:420px){.n21-jump-panel{width:270px}}

/* Reading controls: keep both actions together, never floating over artwork */
.n21-reading-controls {display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:10px auto 0;position:relative;z-index:30}
.n21-reading-controls .n21-jump {margin:0;display:block}
.n21-reading-controls #continueReadingBtn,
.n21-reading-controls #continueReadingBtn.show {position:static!important;inset:auto!important;transform:none!important;float:none!important;display:none;visibility:visible!important;opacity:1!important;width:235px;max-width:calc(100vw - 32px);box-sizing:border-box;min-height:38px;margin:0;padding:9px 14px;border:1px solid #7771b4;border-radius:12px;background:linear-gradient(135deg,#242743,#101424);color:#eeeaff;box-shadow:0 3px 14px #0008;font:600 12px 'Open Sans',sans-serif;text-align:center;text-decoration:none;line-height:18px;z-index:auto!important}
.n21-reading-controls #continueReadingBtn.show {display:inline-flex;align-items:center;justify-content:center;gap:7px}
.n21-reading-controls #continueReadingBtn.show:hover,
.n21-reading-controls #continueReadingBtn.show:focus-visible {border-color:#b3a4ed;box-shadow:0 0 12px #7269c366;color:#fff}
/* Mobile: two reading actions in one tidy row. Desktop remains unchanged. */
@media (max-width: 600px) {
  .n21-reading-controls {
    display: flex;
    flex-wrap: nowrap;
    width: calc(100% - 32px);
    max-width: 500px;
    box-sizing: border-box;
    gap: 8px;
    align-items: stretch;
  }

  .n21-reading-controls #continueReadingBtn.show,
  .n21-reading-controls .n21-jump {
    flex: 1 1 0;
    width: auto;
    min-width: 0;
    max-width: none;
    box-sizing: border-box;
  }

  .n21-reading-controls #continueReadingBtn.show,
  .n21-reading-controls .n21-jump-trigger {
    width: 100%;
    max-width: none;
    min-width: 0;
    min-height: 46px;
    padding: 9px 7px;
    box-sizing: border-box;
    font-size: clamp(10px, 2.8vw, 12px);
    white-space: nowrap;
  }

  .n21-reading-controls .n21-jump-trigger { gap: 4px; }

  /* Keep the expanded chapter menu inside the phone viewport. */
  .n21-reading-controls .n21-jump-panel {
    left: auto;
    right: 0;
    transform: none;
    width: min(290px, calc(100vw - 32px));
    max-width: calc(100vw - 32px);
  }

  /* Without saved reading progress, let the page picker fill the row. */
  .n21-reading-controls:not(:has(#continueReadingBtn.show)) .n21-jump {
    flex: 0 1 235px;
    margin-inline: auto;
  }
}
/* Homepage title panel — matches Extras/Archive; scoped to home only. */
.n21-home-hero {
  box-sizing:border-box;
  width:calc(100% - 32px);
  max-width:900px;
  margin:18px auto 22px;

}
.n21-home-hero h1 {

/* About panel support invitation */
.comic-intro .n21-about-support {margin-top:18px;padding-top:15px;border-top:1px solid rgba(177,164,237,.35);text-align:center}
.comic-intro .n21-about-support p {margin:0 0 10px;color:#e8ecf4}
.comic-intro .n21-about-support strong {color:#d7caff}
.comic-intro .n21-support-link {display:inline-block;padding:9px 17px;border-radius:8px;border:1px solid #8d82c5;background:linear-gradient(135deg,#71313f,#411b31);color:#fff;font:700 .87rem 'Open Sans',sans-serif;text-decoration:none}
.comic-intro .n21-support-link:hover,.comic-intro .n21-support-link:focus-visible {background:linear-gradient(135deg,#91445a,#602742);color:white}
/* Shared notes and comments panel; keep the existing notes and CommentBox hooks. */
.n21-discussion-panel {box-sizing:border-box;width:calc(100% - 40px);max-width:900px;margin:28px auto 34px;padding:24px;background:rgba(17,24,39,.88);border:1px solid rgba(93,97,171,.85);border-radius:8px;box-shadow:0 2px 8px #0005;text-align:left;clear:both}
.n21-discussion-panel #authorNotes,.n21-discussion-panel #commentsWrap {box-sizing:border-box;width:100%;max-width:none;margin:0!important;float:none!important;box-shadow:none!important;border:0!important;background:transparent!important;padding:0!important;overflow:visible}
.n21-discussion-panel #authorNotes h2,.n21-discussion-panel .comments-title {text-align:center}
.n21-discussion-divider {border:0;border-top:1px solid rgba(177,164,237,.38);margin:24px 0}
@media(max-width:600px){.n21-discussion-panel{width:calc(100% - 24px);padding:18px 16px}}

/* Top Web Comics voting art beside the comic's bottom navigation. */
.n21-comic-nav-row { position:relative; width:calc(100% - 24px); max-width:900px; margin:0 auto; min-height:72px; display:flex; align-items:center; justify-content:center; }
.n21-comic-nav-row > .writeNav { width:100%; text-align:center; }
.n21-vote-button { position:absolute; right:0; top:50%; transform:translateY(-50%); display:block; width:168px; max-width:24%; z-index:2; line-height:0; border-radius:11px; }
.n21-vote-button img { width:100%; height:auto; display:block; border-radius:11px; border:1px solid #7771b4; box-sizing:border-box; box-shadow:0 3px 12px #0008; transition:transform .2s ease,box-shadow .2s ease; }
.n21-vote-button:hover img,.n21-vote-button:focus-visible img { transform:translateY(-2px); box-shadow:0 0 15px #9682e68c; }
.n21-vote-button:focus-visible { outline:2px solid #c5b6ff; outline-offset:4px; }
@media(max-width:1000px) { .n21-comic-nav-row { flex-direction:column; gap:12px; padding-bottom:8px; } .n21-vote-button { position:static; transform:none; width:180px; max-width:75%; } }

/* Gentle hover and keyboard focus for the comic page navigation. */
.n21-comic-nav-row .writeNav a,
.n21-comic-nav-row .writeNav button,
.n21-comic-nav-row .writeNav input[type="image"] {
  display:inline-block;
  border-radius:9px;
  transition:transform .18s ease, filter .18s ease, box-shadow .18s ease;
}
.n21-comic-nav-row .writeNav a:hover,
.n21-comic-nav-row .writeNav a:focus-visible,
.n21-comic-nav-row .writeNav button:hover,
.n21-comic-nav-row .writeNav button:focus-visible,
.n21-comic-nav-row .writeNav input[type="image"]:hover,
.n21-comic-nav-row .writeNav input[type="image"]:focus-visible {
  transform:translateY(-2px);
  filter:brightness(1.15) drop-shadow(0 0 7px rgba(170,145,255,.75));
}
.n21-comic-nav-row .writeNav a:focus-visible,
.n21-comic-nav-row .writeNav button:focus-visible,
.n21-comic-nav-row .writeNav input[type="image"]:focus-visible {
  outline:2px solid #c5b6ff;
  outline-offset:3px;
}
@media (prefers-reduced-motion:reduce) {
  .n21-comic-nav-row .writeNav a,
  .n21-comic-nav-row .writeNav button,
  .n21-comic-nav-row .writeNav input[type="image"] {transition:none;}
  .n21-comic-nav-row .writeNav a:hover,
  .n21-comic-nav-row .writeNav a:focus-visible,
  .n21-comic-nav-row .writeNav button:hover,
  .n21-comic-nav-row .writeNav button:focus-visible,
  .n21-comic-nav-row .writeNav input[type="image"]:hover,
  .n21-comic-nav-row .writeNav input[type="image"]:focus-visible {transform:none;}
}

<script src="js/comic_header.js"></script>
<script>
(function(){
 const output=document.getElementById('n21-lab-data');
 function measure(){
  const h=document.documentElement,b=document.body,v=window.visualViewport;
  const rows=[
   'innerWidth: '+innerWidth,
   'visualViewport.width: '+(v?Math.round(v.width):'n/a'),
   'html.clientWidth: '+h.clientWidth,
   'html.scrollWidth: '+h.scrollWidth,
   'body width: '+Math.round(b.getBoundingClientRect().width),
   'orientation: '+(matchMedia('(orientation: portrait)').matches?'portrait':'landscape')
  ];
  output.textContent=rows.join(' | ');
 }
 addEventListener('resize',measure);addEventListener('orientationchange',measure);
 if(window.visualViewport)visualViewport.addEventListener('resize',measure);
 addEventListener('load',measure);measure();
})();
</script>

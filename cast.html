  <script>
const characters = [
  {
    name: "Kai",
    image: "img/cast/profile-kai.png",
    bio: "Kai is a teenage boy taken in by the Shimizu family after an unknown traumatic incident leaves him with no memory of his identity. Caring, curious, and intensely social, he quickly grows attached to his new family even as serious trust issues make it difficult for him to open up about his past. Strange abilities—including moving objects with his mind—suggest there is much more to Kai than anyone realizes. Despite everything he has endured, he remains determined to explore the world around him and protect the people he loves.",
    color: "rgba(87,108,153,0.72)"
  },
  {
    name: "Dr. Kuro Shimizu",
    image: "img/cast/profile-kuro.png",
    bio: "Dr. Kuro Shimizu is a 38-year-old surgeon, Yoshiko's father, and the man who takes Kai into his home after finding him injured in the street. Originally from Japan, Kuro moved to the United States with Yoshiko following the death of his wife. Grumpy, frugal, and intensely private, he carries a complicated past and keeps his mind constantly occupied rather than confronting his grief. Beneath his cranky exterior, however, Kuro has an enormous soft spot for his children, his patients, and the people he considers family.",
    color: "rgba(213,142,133,0.72)"
  },
  {
    name: "Yoshiko Shimizu",
    image: "img/cast/profile-yoshiko.png",
    bio: "Yoshiko Shimizu is Kuro's 14-year-old daughter and one of Kai's closest friends. After losing her mother and watching her father struggle with grief, Yoshiko became fiercely independent and self-sufficient at a young age. Sarcastic, artistic, and not particularly interested in socializing, she would still do almost anything for the people she considers family. Her relationship with Kai quickly grows into one of the most important bonds in both of their lives.",
    color: "rgba(97,66,126,0.72)"
  },
  {
    name: "Shingen Yamagata",
    image: "img/cast/profile-shingen.png",
    bio: "Shingen Yamagata is a high school teacher, Kiri's father, and Kuro's longtime best friend and surrogate brother. Neurotic, impulsive, and a little prone to imagining the worst, Shingen has endured his share of messy relationships and family upheaval. Despite his flaws, he is deeply loyal and caring toward the people he considers family, including Kuro and Yoshiko. He may make plenty of mistakes as a father, but his devotion to his family is never in question.",
    color: "rgba(177,126,54,0.72)"
  },
  {
    name: "Kiri Yamagata",
    image: "img/cast/profile-kiri.png",
    bio: "Kiri Yamagata is Shingen's 14-year-old son and Yoshiko's longtime friend and surrogate cousin. Insecure, impulsive, and desperate for acceptance, Kiri struggles with abandonment and years of being bullied when he was younger. He and Yoshiko were once extremely close, but his growing need for popularity and attention has strained their relationship. His jealousy and aggressive reactions—particularly where Kai is concerned—frequently create tension between the two families.",
    color: "rgba(84,95,100,0.72)"
  },
  {
    name: "Creepy Dream Lady",
    image: "img/cast/profile-dreamlady.png",
    bio: "Creepy Dream Lady is a mysterious figure who repeatedly appears in Kai's dreams. Whether she is real remains unclear, but she appears to have some connection to the memories Kai has lost. Although she sometimes speaks to him with an almost loving familiarity, her violent actions and volatile behavior suggest something far more dangerous beneath the surface.",
    color: "rgba(160,190,202,0.72)"
  },
  {
    name: "Stranger",
    image: "img/cast/profile-stranger.png",
    bio: "The Stranger is a mysterious young man who suddenly appears outside Caulwyn High School and announces his presence in a rather violent fashion. Almost nothing is known about him, except for one particularly unsettling detail: he has Kai's face. His identity, his purpose, and his connection to Kai remain a mystery.",
    color: "rgba(253,218,172,0.72)"
  }
];
    let currentIndex = 0;
    const tabs = document.querySelectorAll(".n21-cast-tab");

    tabs.forEach((tab, index) => {
      tab.addEventListener("click", () => showCharacter(index));
    });

    function showCharacter(index) {
      const char = characters[index];
      const img = document.getElementById("charImage");
      const bio = document.getElementById("charBio");

      tabs.forEach((tab, i) => {
        tab.classList.remove("active");
        tab.style.backgroundColor = characters[i].color;
      });

      tabs[index].classList.add("active");
      document.querySelector(".n21-cast-wrap").style.setProperty("--n21-panel-color", char.color);

      img.style.opacity = 0;
      img.style.transform = "translateX(18px)";
      bio.style.opacity = 0;
      bio.style.transform = "translateX(-10px) rotate(-0.7deg)";

      setTimeout(() => {
        document.getElementById("charName").textContent = char.name;
        document.getElementById("charText").textContent = char.bio;
        img.src = char.image;

// convert rgba to lighter version
function lightenColor(color) {
  return color.replace(/rgba?\(([^)]+)\)/, (match, values) => {
    let [r, g, b, a] = values.split(',').map(v => parseFloat(v));
    
    // push toward white
    r = Math.min(255, r + 80);
    g = Math.min(255, g + 80);
    b = Math.min(255, b + 80);

    return `rgba(${r}, ${g}, ${b}, 0.85)`;
  });
}

const lightColor = lightenColor(char.color);

bio.style.background = `
  repeating-linear-gradient(
    to bottom,
    ${lightColor} 0px,
    ${lightColor} 27px,
    rgba(95,145,195,0.38) 28px,
    ${lightColor} 29px
  )
`;

        img.style.opacity = 1;
        img.style.transform = "translateX(0)";
        bio.style.opacity = 1;
        bio.style.transform = "translateX(0) rotate(-0.7deg)";
      }, 180);

      currentIndex = index;
    }

    document.addEventListener("keydown", function(e) {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;

      if (e.key === "ArrowDown") {
        e.preventDefault();
        showCharacter((currentIndex + 1) % characters.length);
      }

      if (e.key === "ArrowUp") {
        e.preventDefault();
        showCharacter((currentIndex - 1 + characters.length) % characters.length);
      }
    });

    function toggleShare(e) {
      e.preventDefault();
      document.getElementById("shareBar").classList.toggle("open");
    }

    function copyLink() {
      navigator.clipboard.writeText("https://nocturne21.com");
    }

    window.addEventListener("load", () => {
      showCharacter(0);
    });
  </script>

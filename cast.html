/* Cast scrapbook gallery: finished artwork, no overlays or cropping. */
.n21-cast-wrap { max-width: 1000px; margin: 0 auto; }
.n21-cast-layout { display: flex; align-items: flex-start; max-width: 1000px; margin: 20px auto 0; }
.n21-cast-tabs { width: 88px; flex: 0 0 88px; display: flex; flex-direction: column; gap: 8px; padding-top: 8px; margin-right: -8px; position: relative; z-index: 2; }
.n21-cast-tab { display: block; width: 100%; padding: 0; border: 2px solid transparent; border-right: 0; border-radius: 14px 0 0 14px; cursor: pointer; overflow: hidden; background: rgba(90,88,144,.55); transition: transform .2s ease, filter .2s ease; }
.n21-cast-tab img { width: 100%; height: auto; display: block; }
.n21-cast-tab:hover { transform: translateX(-4px); filter: brightness(1.12); }
.n21-cast-tab.active { transform: translateX(-6px); border-color: #b6a9e8; filter: brightness(1.07); }
.n21-cast-tab:focus-visible { outline: 3px solid #8ee9ed; outline-offset: 3px; }
#characterDisplay.n21-cast-display { flex: 1; min-width: 0; padding: 12px; border: 1px solid rgba(170,155,222,.5); border-radius: 12px; background: rgba(7,9,22,.78); box-shadow: 0 12px 28px rgba(0,0,0,.3); }
.n21-cast-art { display: block; width: 100%; height: auto; max-width: 100%; border-radius: 5px; }
.n21-cast-fallback-bio { padding: 18px 16px 6px; color: #e5e2f3; line-height: 1.65; }
.n21-cast-fallback-bio h2 { color: #e9d9f5; margin: 0 0 8px; }
.n21-cast-fallback-bio p { margin: 0; }
.n21-cast-visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
@media (max-width: 800px) {
  .n21-cast-layout { flex-direction: column; gap: 12px; }
  .n21-cast-tabs { width: 100%; flex: none; flex-direction: row; gap: 10px; margin: 0; padding: 3px 2px 8px; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
  .n21-cast-tab { width: 70px; flex: 0 0 70px; border: 2px solid transparent; border-radius: 10px; }
  .n21-cast-tab.active, .n21-cast-tab:hover { transform: none; border-color: #b6a9e8; }
  #characterDisplay.n21-cast-display { width: 100%; box-sizing: border-box; padding: 8px; }
}
@media (max-width: 480px) { .n21-cast-tab { width: 60px; flex-basis: 60px; } #characterDisplay.n21-cast-display { padding: 5px; } }
@media (prefers-reduced-motion: reduce) { .n21-cast-tab { transition: none; } }


/* Yoshiko&#x27;s handmade torn-paper character tabs. Original art and profiles stay intact. */
.n21-cast-tabs {
  width: 190px; flex: 0 0 190px; gap: 9px;
  padding: 12px 8px 16px 3px; margin-right: -5px;
  overflow: visible;
}
.n21-cast-tab {
  --scrap: #a8a0c9;
  --tilt: -1.5deg;
  display: flex; align-items: center; gap: 8px;
  width: 100%; min-height: 76px; box-sizing: border-box;
  padding: 8px 12px 8px 9px;
  color: #16131c; text-align: left;
  border: 0; border-radius: 0;
  position: relative; isolation: isolate; overflow: visible;
  background: var(--scrap);
  clip-path: polygon(0 3%, 9% 1%, 20% 3%, 33% 0, 46% 2%, 58% 1%, 71% 3%, 85% 0, 100% 3%, 99% 24%, 100% 48%, 98% 74%, 100% 98%, 86% 100%, 70% 97%, 54% 100%, 38% 98%, 23% 100%, 9% 97%, 0 99%, 2% 74%, 0 52%, 1% 27%);
  transform: rotate(var(--tilt));
  filter: drop-shadow(2px 4px 2px rgba(0,0,0,.35));
  transition: transform .18s ease, filter .18s ease;
}
.n21-cast-tab::before {
  content: &#x27;&#x27;; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: repeating-linear-gradient(0deg, transparent 0 16px, rgba(32,26,48,.08) 17px 18px),
    radial-gradient(circle at 85% 14%, rgba(55,35,47,.20), transparent 32%),
    radial-gradient(circle at 16% 90%, rgba(255,255,255,.22), transparent 40%);
}
.n21-cast-tab:nth-child(1) { --scrap: #b3a4dc; --tilt: -2deg; }
.n21-cast-tab:nth-child(2) { --scrap: #c9b69c; --tilt: 1.5deg; }
.n21-cast-tab:nth-child(3) { --scrap: #d4a9bd; --tilt: -1deg; }
.n21-cast-tab:nth-child(4) { --scrap: #b5adc5; --tilt: 2deg; }
.n21-cast-tab:nth-child(5) { --scrap: #bfc1a0; --tilt: -1.8deg; }
.n21-cast-tab:nth-child(6) { --scrap: #a3b9cb; --tilt: 1deg; }
.n21-cast-tab:nth-child(7) { --scrap: #b9a4c2; --tilt: -1.3deg; }
.n21-tab-photo {
  display: block; flex: 0 0 52px; width: 52px; height: 54px;
  padding: 3px 3px 8px; box-sizing: border-box;
  background: #e9e2d7; box-shadow: 1px 2px 4px rgba(0,0,0,.32);
  transform: rotate(-3deg);
}
.n21-cast-tab:nth-child(even) .n21-tab-photo { transform: rotate(3deg); }
.n21-cast-tab .n21-tab-photo img {
  width: 100%; height: 100%; object-fit: cover; object-position: center top;
}
.n21-tab-label {
  display: block; min-width: 0; font: 700 19px/1.05 &#x27;Patrick Hand&#x27;, &#x27;Ubbing&#x27;, cursive;
  overflow-wrap: anywhere; text-shadow: 0 1px rgba(255,255,255,.2);
}
.n21-cast-tab:nth-child(6) .n21-tab-label { font-size: 17px; }
.n21-cast-tab:hover { transform: translateX(-5px) rotate(0deg); filter: brightness(1.08) drop-shadow(3px 6px 3px rgba(0,0,0,.4)); }
.n21-cast-tab.active { transform: translateX(-9px) rotate(0deg) scale(1.025); filter: brightness(1.09) drop-shadow(3px 5px 3px rgba(0,0,0,.42)); }
.n21-cast-tab.active::after { content: &#x27;✦&#x27;; position: absolute; top: 2px; right: 6px; color: #3d285f; font-size: 16px; }
.n21-cast-tab:focus-visible { outline: 3px solid #8ee9ed; outline-offset: 3px; }
@media (max-width: 800px) {
  .n21-cast-tabs { width: 100%; flex: none; flex-direction: row; gap: 10px; margin: 0; padding: 10px 8px 16px; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; box-sizing: border-box; }
  .n21-cast-tab { width: 140px; flex: 0 0 140px; min-height: 70px; padding: 7px; }
  .n21-tab-photo { flex-basis: 45px; width: 45px; height: 49px; }
  .n21-tab-label { font-size: 17px; }
  .n21-cast-tab:nth-child(6) .n21-tab-label { font-size: 15px; }
  .n21-cast-tab.active { transform: rotate(0deg) translateY(-2px); }
  .n21-cast-tab:hover { transform: rotate(0deg); }
}
@media (max-width: 480px) {
  .n21-cast-tab { width: 133px; flex-basis: 133px; }
}
@media (prefers-reduced-motion: reduce) { .n21-cast-tab { transition: none; } }


/* Kai&#x27;s illustrated tab: use the finished artwork, not CSS paper effects. */
.n21-cast-tab.n21-cast-tab-custom {
  display: block;
  height: auto;
  min-height: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  clip-path: none;
  overflow: visible;
  line-height: 0;
  transform: none;
  filter: drop-shadow(2px 4px 3px rgba(0,0,0,.35));
}
.n21-cast-tab.n21-cast-tab-custom::before,
.n21-cast-tab.n21-cast-tab-custom::after { content: none; }
.n21-cast-tab-custom .n21-custom-tab-art {
  display: block;
  width: 100%;
  height: auto;
  max-width: 100%;
  object-fit: contain;
}
.n21-cast-tab.n21-cast-tab-custom:hover {
  transform: translateX(-4px);
  filter: brightness(1.08) drop-shadow(3px 6px 4px rgba(0,0,0,.4));
}
.n21-cast-tab.n21-cast-tab-custom.active {
  transform: translateX(-7px);
  filter: brightness(1.07) drop-shadow(4px 5px 5px rgba(165,139,233,.35));
}
@media (max-width: 800px) {
  .n21-cast-tab.n21-cast-tab-custom:hover { transform: none; }
  .n21-cast-tab.n21-cast-tab-custom.active { transform: translateY(-2px); }
}

/* Kai artwork sizing and hover refinement — no synthetic red paper behind it. */
.n21-cast-tabs .n21-cast-tab.n21-cast-tab-custom {
  width: 100%;
  min-height: 88px;
  flex-shrink: 0;
  background: none !important;

  box-shadow: none !important;
  clip-path: none !important;
  overflow: visible;
  position: relative;
  z-index: 5;
  transform: translateX(-4px) scale(1.06);
  transform-origin: center right;
  transition: transform .22s ease, filter .22s ease;
}
.n21-cast-tabs .n21-cast-tab.n21-cast-tab-custom .n21-custom-tab-art {
  width: 100%;
  height: auto;

}

.n21-cast-tabs .n21-cast-tab.n21-cast-tab-custom.active:hover {

  .n21-cast-tabs .n21-cast-tab.n21-cast-tab-custom { transition: none; }

    // Finished scrapbook artwork includes the handwritten biography.

    const characters = [
  {
    &quot;name&quot;: &quot;Kai&quot;,
    &quot;image&quot;: &quot;img/characters/profile-kai.jpg&quot;,
    &quot;bio&quot;: &quot;Kai is a teenage boy taken in by the Shimizu family after an unknown traumatic incident leaves him with no memory of his identity. Caring, curious, and intensely social, he quickly grows attached to his new family even as serious trust issues make it difficult for him to open up about his past. Strange abilities—including moving objects with his mind—suggest there is much more to Kai than anyone realizes. Despite everything he has endured, he remains determined to explore the world around him and protect the people he loves.&quot;,
    &quot;fallback&quot;: false
  },
  {
    &quot;name&quot;: &quot;Dr. Kuro Shimizu&quot;,
    &quot;image&quot;: &quot;img/characters/profile-kuro.jpg&quot;,
    &quot;bio&quot;: &quot;Dr. Kuro Shimizu is a 38-year-old surgeon, Yoshiko&#x27;s father, and the man who takes Kai into his home after finding him injured in the street. Originally from Japan, Kuro moved to the United States with Yoshiko following the death of his wife. Grumpy, frugal, and intensely private, he carries a complicated past and keeps his mind constantly occupied rather than confronting his grief. Beneath his cranky exterior, however, Kuro has an enormous soft spot for his children, his patients, and the people he considers family.&quot;,
    &quot;fallback&quot;: false
  },
  {
    &quot;name&quot;: &quot;Yoshiko Shimizu&quot;,
    &quot;image&quot;: &quot;img/characters/profile-yoshiko.jpg&quot;,
    &quot;bio&quot;: &quot;Yoshiko Shimizu is Kuro&#x27;s 14-year-old daughter and one of Kai&#x27;s closest friends. After losing her mother and watching her father struggle with grief, Yoshiko became fiercely independent and self-sufficient at a young age. Sarcastic, artistic, and not particularly interested in socializing, she would still do almost anything for the people she considers family. Her relationship with Kai quickly grows into one of the most important bonds in both of their lives.&quot;,
    &quot;fallback&quot;: false
  },
  {
    &quot;name&quot;: &quot;Shingen Yamagata&quot;,
    &quot;image&quot;: &quot;img/characters/profile-shingen.jpg&quot;,
    &quot;bio&quot;: &quot;Shingen Yamagata is a high school teacher, Kiri&#x27;s father, and Kuro&#x27;s longtime best friend and surrogate brother. Neurotic, impulsive, and a little prone to imagining the worst, Shingen has endured his share of messy relationships and family upheaval. Despite his flaws, he is deeply loyal and caring toward the people he considers family, including Kuro and Yoshiko. He may make plenty of mistakes as a father, but his devotion to his family is never in question.&quot;,
    &quot;fallback&quot;: false
  },
  {
    &quot;name&quot;: &quot;Kiri Yamagata&quot;,
    &quot;image&quot;: &quot;img/characters/profile-kiri.jpg&quot;,
    &quot;bio&quot;: &quot;Kiri Yamagata is Shingen&#x27;s 14-year-old son and Yoshiko&#x27;s longtime friend and surrogate cousin. Insecure, impulsive, and desperate for acceptance, Kiri struggles with abandonment and years of being bullied when he was younger. He and Yoshiko were once extremely close, but his growing need for popularity and attention has strained their relationship. His jealousy and aggressive reactions—particularly where Kai is concerned—frequently create tension between the two families.&quot;,
    &quot;fallback&quot;: false
  },
  {
    &quot;name&quot;: &quot;Creepy Dream Lady&quot;,
    &quot;image&quot;: &quot;img/characters/profile-marunin.jpg&quot;,
    &quot;bio&quot;: &quot;Creepy Dream Lady is a mysterious figure who repeatedly appears in Kai&#x27;s dreams. Whether she is real remains unclear, but she appears to have some connection to the memories Kai has lost. Although she sometimes speaks to him with an almost loving familiarity, her violent actions and volatile behavior suggest something far more dangerous beneath the surface.&quot;,
    &quot;fallback&quot;: false
  },
  {
    &quot;name&quot;: &quot;Stranger&quot;,
    &quot;image&quot;: &quot;img/cast/profile-stranger.png&quot;,
    &quot;bio&quot;: &quot;The Stranger is a mysterious young man who suddenly appears outside Caulwyn High School and announces his presence in a rather violent fashion. Almost nothing is known about him, except for one particularly unsettling detail: he has Kai&#x27;s face. His identity, his purpose, and his connection to Kai remain a mystery.&quot;,
    &quot;fallback&quot;: true
  }
];

    const image = document.getElementById(&#x27;charImage&#x27;);
    const accessibleBio = document.getElementById(&#x27;charAccessibleBio&#x27;);
    const fallbackBio = document.getElementById(&#x27;fallbackBio&#x27;);
    let currentIndex = 0;
    const dossierPages = {&quot;0&quot;: &quot;&lt;h2&gt;CASE FILE: KAI&lt;/h2&gt;\n                &lt;div class=\&quot;n21-dossier-facts\&quot;&gt;\n                  &lt;p&gt;&lt;strong&gt;Age:&lt;/strong&gt; 14–16 maybe?&lt;/p&gt;\n                  &lt;p&gt;&lt;strong&gt;Relation:&lt;/strong&gt; Adopted best friend&lt;/p&gt;\n                &lt;/div&gt;\n                &lt;section class=\&quot;n21-dossier-redactions\&quot; aria-label=\&quot;Kai&#x27;s unknown past\&quot;&gt;\n                  &lt;h3&gt;Background information&lt;/h3&gt;\n                  &lt;p&gt;Place of birth: &lt;span class=\&quot;n21-blackout\&quot; aria-label=\&quot;Redacted\&quot;&gt;&lt;/span&gt;&lt;/p&gt;\n                  &lt;p&gt;Family history: &lt;span class=\&quot;n21-blackout short\&quot; aria-label=\&quot;Redacted\&quot;&gt;&lt;/span&gt;&lt;/p&gt;\n                  &lt;p&gt;Previous residence: &lt;span class=\&quot;n21-blackout\&quot; aria-label=\&quot;Redacted\&quot;&gt;&lt;/span&gt;&lt;/p&gt;\n                  &lt;span class=\&quot;n21-classified\&quot; aria-hidden=\&quot;true\&quot;&gt;REDACTED&lt;/span&gt;\n                  &lt;p class=\&quot;n21-redaction-note\&quot;&gt;↳ I don&#x27;t actually know what&#x27;s under these.&lt;/p&gt;\n                  &lt;p class=\&quot;n21-redaction-note\&quot;&gt;Seriously.&lt;/p&gt;\n                  &lt;p class=\&quot;n21-redaction-note\&quot;&gt;I asked him. He doesn&#x27;t know.&lt;/p&gt;\n                &lt;/section&gt;\n                &lt;h3&gt;Known habits&lt;/h3&gt;\n                &lt;p&gt;Drinks enough coffee to concern a medical professional. Unfortunately, the medical professional in this house is Dad, and he has other things to worry about.&lt;/p&gt;\n                &lt;h3&gt;Suspicious activity&lt;/h3&gt;\n                &lt;p&gt;Can make friends with practically anyone. Has a talent for appearing wherever the snacks are. Claims he doesn&#x27;t need shoes. This is not normal behavior.&lt;/p&gt;\n                &lt;h3&gt;Personal observations&lt;/h3&gt;\n                &lt;p&gt;He&#x27;s curious about everything, asks a million questions, and somehow makes our very quiet house feel less quiet.&lt;/p&gt;\n                &lt;p class=\&quot;n21-dossier-note\&quot;&gt;&lt;strong&gt;Yoshiko&#x27;s note:&lt;/strong&gt; He&#x27;s family. Don&#x27;t tell him I wrote that. He&#x27;ll be unbearable. ♡&lt;/p&gt;\n                &quot;, &quot;1&quot;: &quot;&lt;h2&gt;CASE FILE: DR. KURO SHIMIZU&lt;/h2&gt;&lt;div class=\&quot;n21-dossier-facts\&quot;&gt;&lt;p&gt;&lt;strong&gt;Age:&lt;/strong&gt; 38&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Relation:&lt;/strong&gt; Dad&lt;/p&gt;&lt;/div&gt;&lt;section class=\&quot;n21-dossier-redactions\&quot; aria-label=\&quot;Kuro’s suspiciously incomplete answers\&quot;&gt;&lt;h3&gt;Information Dad definitely doesn&#x27;t know (apparently)&lt;/h3&gt;&lt;p&gt;What happened before Kai arrived: &lt;span class=\&quot;n21-blackout\&quot; aria-label=\&quot;Redacted\&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p&gt;Things Dad isn&#x27;t telling me: &lt;span class=\&quot;n21-blackout short\&quot; aria-label=\&quot;Redacted\&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;span class=\&quot;n21-classified\&quot; aria-hidden=\&quot;true\&quot;&gt;REDACTED&lt;/span&gt;&lt;p class=\&quot;n21-redaction-note\&quot;&gt;He says he doesn&#x27;t know anything.&lt;/p&gt;&lt;p class=\&quot;n21-redaction-note\&quot;&gt;I asked him again. Same answer.&lt;/p&gt;&lt;p class=\&quot;n21-redaction-note\&quot;&gt;HE&#x27;S DOING THAT THING WHERE HE PRETENDS HE DOESN&#x27;T KNOW WHAT I&#x27;M TALKING ABOUT.&lt;/p&gt;&lt;/section&gt;&lt;h3&gt;Known habits&lt;/h3&gt;&lt;p&gt;Works too much. Drinks coffee like it&#x27;s a medical necessity. Has the ability to make an entire room feel guilty just by raising one eyebrow.&lt;/p&gt;&lt;h3&gt;Suspicious activity&lt;/h3&gt;&lt;p&gt;Claims he&#x27;s not worried. Is clearly worried. Claims he doesn&#x27;t know. Somehow has a very specific opinion anyway.&lt;/p&gt;&lt;h3&gt;Personal observations&lt;/h3&gt;&lt;p&gt;He&#x27;s a terrible liar. Unfortunately, he&#x27;s also very committed. He cooks, he worries, and he pretends he isn&#x27;t doing either for our benefit.&lt;/p&gt;&lt;p class=\&quot;n21-dossier-note\&quot;&gt;&lt;strong&gt;Yoshiko&#x27;s note:&lt;/strong&gt; He&#x27;s still my dad. I guess I&#x27;ll keep him. Don&#x27;t tell him I said that.&lt;/p&gt;&quot;, &quot;2&quot;: &quot;&lt;h2&gt;CASE FILE: YOSHIKO SHIMIZU&lt;/h2&gt;&lt;div class=\&quot;n21-dossier-facts\&quot;&gt;&lt;p&gt;&lt;strong&gt;Age:&lt;/strong&gt; 14&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Relation:&lt;/strong&gt; Me (obviously)&lt;/p&gt;&lt;/div&gt;&lt;h3&gt;Known habits&lt;/h3&gt;&lt;p&gt;Excellent artist. Highly observant. The only person in this house capable of keeping a sensible filing system.&lt;/p&gt;&lt;h3&gt;Suspicious activity&lt;/h3&gt;&lt;p&gt;NONE. This investigator has been cleared of all wrongdoing by an impartial review board. (Me.)&lt;/p&gt;&lt;h3&gt;Personal observations&lt;/h3&gt;&lt;p&gt;Someone has to keep an eye on these people. Do I get thanked? No. Do I get asked why I&#x27;m writing things down? Constantly.&lt;/p&gt;&lt;p class=\&quot;n21-dossier-note\&quot;&gt;&lt;strong&gt;Official conclusion:&lt;/strong&gt; Brilliant, responsible, and tragically underappreciated. Any opposing testimony is inadmissible.&lt;/p&gt;&quot;, &quot;3&quot;: &quot;&lt;h2&gt;CASE FILE: SHINGEN YAMAGATA&lt;/h2&gt;&lt;div class=\&quot;n21-dossier-facts\&quot;&gt;&lt;p&gt;&lt;strong&gt;Age:&lt;/strong&gt; Adult. Ask him.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Relation:&lt;/strong&gt; Honorary uncle / Dad’s best friend&lt;/p&gt;&lt;/div&gt;&lt;h3&gt;Known habits&lt;/h3&gt;&lt;p&gt;Checks on everyone. Then checks again to make sure the first check worked. Gives advice whether anyone asked for it or not.&lt;/p&gt;&lt;h3&gt;Suspicious activity&lt;/h3&gt;&lt;p&gt;Can turn one minor inconvenience into a full-scale family emergency in approximately four seconds.&lt;/p&gt;&lt;h3&gt;Personal observations&lt;/h3&gt;&lt;p&gt;He&#x27;s loud, he worries too much, and he somehow always shows up when we need him. Dad pretends to be annoyed. Nobody is fooled.&lt;/p&gt;&lt;p class=\&quot;n21-dossier-note\&quot;&gt;&lt;strong&gt;Yoshiko&#x27;s note:&lt;/strong&gt; If he asks, I said only nice things. I do not have time for the follow-up conversation.&lt;/p&gt;&quot;, &quot;4&quot;: &quot;&lt;h2&gt;CASE FILE: KIRI YAMAGATA&lt;/h2&gt;&lt;div class=\&quot;n21-dossier-facts\&quot;&gt;&lt;p&gt;&lt;strong&gt;Age:&lt;/strong&gt; 14&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Relation:&lt;/strong&gt; Basically my cousin (unfortunately)&lt;/p&gt;&lt;/div&gt;&lt;h3&gt;Known habits&lt;/h3&gt;&lt;p&gt;Worries a lot about what other people think of him. Would rather die than admit he&#x27;s worried about what other people think of him.&lt;/p&gt;&lt;h3&gt;Suspicious activity&lt;/h3&gt;&lt;p&gt;Suddenly has opinions about EVERYTHING Kai does. Especially things that have absolutely nothing to do with him.&lt;/p&gt;&lt;h3&gt;Personal observations&lt;/h3&gt;&lt;p&gt;We&#x27;ve known each other forever. Which means I remember when he was less concerned with looking cool and more concerned with being an actual person.&lt;/p&gt;&lt;p class=\&quot;n21-dossier-note\&quot;&gt;&lt;strong&gt;Yoshiko&#x27;s note:&lt;/strong&gt; He can be a jerk. He&#x27;s also family. Both things can be true, and it&#x27;s incredibly annoying.&lt;/p&gt;&quot;, &quot;5&quot;: &quot;&lt;h2&gt;CASE FILE: CREEPY DREAM LADY&lt;/h2&gt;&lt;div class=\&quot;n21-dossier-facts\&quot;&gt;&lt;p&gt;&lt;strong&gt;Age:&lt;/strong&gt; ???&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Relation:&lt;/strong&gt; Unknown. Thankfully.&lt;/p&gt;&lt;/div&gt;&lt;h3&gt;Known habits&lt;/h3&gt;&lt;p&gt;Appearing in Kai&#x27;s dreams. Being extremely unsettling. Apparently not understanding the concept of personal space.&lt;/p&gt;&lt;h3&gt;Suspicious activity&lt;/h3&gt;&lt;p&gt;Everything. Literally everything about this situation is suspicious.&lt;/p&gt;&lt;h3&gt;Personal observations&lt;/h3&gt;&lt;p&gt;I can&#x27;t exactly interview somebody who only shows up in somebody else&#x27;s dreams. This is making my investigative work VERY difficult.&lt;/p&gt;&lt;p class=\&quot;n21-dossier-note\&quot;&gt;&lt;strong&gt;Yoshiko&#x27;s note:&lt;/strong&gt; If you see her, maybe don&#x27;t introduce yourself. Just a thought.&lt;/p&gt;&quot;, &quot;6&quot;: &quot;&lt;h2&gt;CASE FILE: THE STRANGER&lt;/h2&gt;&lt;div class=\&quot;n21-dossier-facts\&quot;&gt;&lt;p&gt;&lt;strong&gt;Age:&lt;/strong&gt; ???&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Relation:&lt;/strong&gt; Unknown. Looks familiar, though.&lt;/p&gt;&lt;/div&gt;&lt;h3&gt;Known habits&lt;/h3&gt;&lt;p&gt;Showing up without an invitation. Making a terrible first impression.&lt;/p&gt;&lt;h3&gt;Suspicious activity&lt;/h3&gt;&lt;p&gt;Has Kai&#x27;s face. I feel like this should be a much bigger deal to everybody.&lt;/p&gt;&lt;h3&gt;Personal observations&lt;/h3&gt;&lt;p&gt;Identity: unknown. Motives: unknown. Explanation for any of this: ALSO UNKNOWN. I am surrounded by people who refuse to provide useful answers.&lt;/p&gt;&lt;p class=\&quot;n21-dossier-note\&quot;&gt;&lt;strong&gt;Yoshiko&#x27;s note:&lt;/strong&gt; This case is getting ridiculous.&lt;/p&gt;&quot;};
    function closeDossier() {
      const dossier = document.getElementById(&#x27;characterDossier&#x27;);
      if (window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches) {
        dossier.open = false;
      } else {
        dossier.classList.add(&#x27;is-closing&#x27;);
        window.setTimeout(() =&gt; { dossier.open = false; dossier.classList.remove(&#x27;is-closing&#x27;); }, 320);
      }
      dossier.scrollIntoView({behavior:&#x27;auto&#x27;,block:&#x27;nearest&#x27;});
    }
    function showCharacter(index) {
      const char = characters[index];
      if (!char) return;
      currentIndex = index;
      const dossier = document.getElementById(&#x27;characterDossier&#x27;);
      dossier.open = false;
      dossier.classList.remove(&#x27;is-closing&#x27;);
      dossier.querySelector(&#x27;.n21-dossier-writing&#x27;).innerHTML = dossierPages[index] + &#x27;&lt;button class=&quot;n21-dossier-close&quot; type=&quot;button&quot;&gt;✕ Close secret file&lt;/button&gt;&#x27;;
      dossier.querySelector(&#x27;summary&#x27;).setAttribute(&#x27;aria-label&#x27;, &#x27;Open Yoshiko\&#x27;s super secret file on &#x27; + char.name);
      dossier.querySelector(&#x27;.n21-dossier-close&#x27;).addEventListener(&#x27;click&#x27;, closeDossier);
      dossier.hidden = false;
      tabs.forEach((tab, i) =&gt; {
        tab.classList.toggle(&#x27;active&#x27;, i === index);
        tab.setAttribute(&#x27;aria-pressed&#x27;, String(i === index));
      });
      image.src = char.image;
      image.alt = char.name + (char.fallback ? &#x27; character illustration&#x27; : &#x27; illustrated scrapbook profile&#x27;);
      accessibleBio.textContent = char.name + &#x27;. &#x27; + char.bio;
      fallbackBio.hidden = !char.fallback;
      if (char.fallback) {
        fallbackBio.replaceChildren();
        const heading = document.createElement(&#x27;h2&#x27;);
        heading.textContent = char.name;
        const text = document.createElement(&#x27;p&#x27;);
        text.textContent = char.bio;
        fallbackBio.append(heading, text);
      }
    }
    tabs.forEach((tab, index) =&gt; tab.addEventListener(&#x27;click&#x27;, () =&gt; showCharacter(index)));
    const mobileProfile = document.getElementById(&#x27;characterDisplay&#x27;);
    const mobileClose = document.querySelector(&#x27;.n21-mobile-close&#x27;);
    let lastPhoto = null;
    function closeMobileProfile() {
      mobileProfile.classList.remove(&#x27;n21-mobile-open&#x27;);
      document.body.classList.remove(&#x27;n21-cast-modal-open&#x27;);
      if (lastPhoto) lastPhoto.focus();
    }
    document.querySelectorAll(&#x27;.n21-mobile-photo&#x27;).forEach(photo =&gt; {
      photo.addEventListener(&#x27;click&#x27;, () =&gt; {
        lastPhoto = photo;
        showCharacter(Number(photo.dataset.index));
        mobileProfile.classList.add(&#x27;n21-mobile-open&#x27;);
        document.body.classList.add(&#x27;n21-cast-modal-open&#x27;);
        mobileProfile.scrollTop = 0;
        mobileClose.focus();
      });
    });
    mobileClose.addEventListener(&#x27;click&#x27;, closeMobileProfile);
    document.addEventListener(&#x27;keydown&#x27;, e =&gt; {
      if (e.key === &#x27;Escape&#x27; &amp;&amp; mobileProfile.classList.contains(&#x27;n21-mobile-open&#x27;)) closeMobileProfile();
    });
    document.addEventListener(&#x27;keydown&#x27;, e =&gt; {
      if (e.target.closest(&#x27;input, textarea, select, [contenteditable=&quot;true&quot;]&#x27;)) return;
      if (e.key === &#x27;ArrowDown&#x27; || e.key === &#x27;ArrowRight&#x27;) showCharacter((currentIndex + 1) % characters.length);
      else if (e.key === &#x27;ArrowUp&#x27; || e.key === &#x27;ArrowLeft&#x27;) showCharacter((currentIndex - 1 + characters.length) % characters.length);
      else return;
      if (e.target.closest(&#x27;.n21-cast-tabs&#x27;)) { e.preventDefault(); tabs[currentIndex].focus(); }
    });
    function toggleShare(e) { e.preventDefault(); document.getElementById(&#x27;shareBar&#x27;).classList.toggle(&#x27;open&#x27;); }
    function copyLink() { navigator.clipboard.writeText(&#x27;https://nocturne21.com&#x27;); }
    showCharacter(0);
  &lt;/script&gt;

/* Pin the fasteners to the corkboard&#x27;s layout coordinates, independent of tab transforms. */
(function () {
  const board = document.getElementById(&#x27;thumbContainer&#x27;);
  if (!board) return;
  const tabs = Array.from(board.querySelectorAll(&#x27;.n21-cast-tab-custom&#x27;));
  const pins = tabs.map(() =&gt; {
    const pin = document.createElement(&#x27;span&#x27;);
    pin.className = &#x27;n21-stationary-fastener&#x27;;
    pin.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
    board.appendChild(pin);
    return pin;
  });
  function placePins() {
    tabs.forEach((tab, i) =&gt; {
      const width = tab.offsetWidth * .12;
      pins[i].style.width = width + &#x27;px&#x27;;
      pins[i].style.left = (tab.offsetLeft + tab.offsetWidth * .05) + &#x27;px&#x27;;
      pins[i].style.top = (tab.offsetTop + tab.offsetWidth * .03) + &#x27;px&#x27;;
    });
  }
  placePins();
  window.addEventListener(&#x27;resize&#x27;, placePins);
  tabs.forEach(tab =&gt; {
    const img = tab.querySelector(&#x27;img&#x27;);
    if (img &amp;&amp; !img.complete) img.addEventListener(&#x27;load&#x27;, placePins, {once:true});
  });
})();
&lt;/script&gt;

&lt;script&gt;
(function(){
  function fitMobileDossier(){
    const paper=document.querySelector(&#x27;#characterDossier .n21-dossier-content&#x27;);
    const writing=paper?.querySelector(&#x27;.n21-dossier-writing&#x27;);
    if(!paper || !writing) return;
    writing.style.transform=&#x27;&#x27;; writing.style.width=&#x27;&#x27;;
    if(!window.matchMedia(&#x27;(max-width: 1366px)&#x27;).matches || !paper.closest(&#x27;details&#x27;)?.open) return;
    const style=getComputedStyle(paper);
    const available=paper.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom);
    const needed=writing.scrollHeight;
    if(needed&gt;available &amp;&amp; available&gt;0){
      // Keep text inside the paper. Width compensates for scaling to preserve wrapping.
      let factor=Math.min(1,available/needed);
      for(let i=0;i&lt;4;i++){
        writing.style.width=(100/factor)+&#x27;%&#x27;;
        const revised=writing.scrollHeight;
        factor=Math.min(factor,available/revised);
      }
      writing.style.width=(100/factor)+&#x27;%&#x27;;
      writing.style.transform=&#x27;scale(&#x27;+factor+&#x27;)&#x27;;
    }
  }
  document.addEventListener(&#x27;toggle&#x27;,e=&gt;{if(e.target?.id===&#x27;characterDossier&#x27;)requestAnimationFrame(fitMobileDossier)},true);
  window.addEventListener(&#x27;resize&#x27;,()=&gt;requestAnimationFrame(fitMobileDossier));
  window.addEventListener(&#x27;orientationchange&#x27;,()=&gt;requestAnimationFrame(()=&gt;requestAnimationFrame(fitMobileDossier)));
  document.addEventListener(&#x27;click&#x27;,e=&gt;{if(e.target.closest(&#x27;.n21-cast-tab&#x27;))requestAnimationFrame(()=&gt;requestAnimationFrame(fitMobileDossier))});
  document.fonts?.ready.then(fitMobileDossier);
})();
&lt;/script&gt;
